# config/models.yaml
# Inference routing. The D-A-I spine (dai-assistant) is the default backend: one
# OpenAI-compatible router that rotates free provider tiers and enforces
# policy/sovereign.json. The direct cloud backends below are fallbacks, not defaults.

default_backend: dai_router
fallback_backend: ollama

# The D-A-I spine — dai-assistant `services/model-router` on 127.0.0.1:11435.
# Per-role temperature is read from the matching entry in the `ollama:` block below,
# which is retained purely as the per-role temperature table.
dai_router:
  base_url: http://127.0.0.1:11435/v1
  models:
    genie: dai/auto
    coding: dai/auto
    design: dai/auto
    reporting: dai/auto
    qa: dai/auto
    research: dai/auto
    integration: dai/auto
    sidekick: dai/auto
    vision: dai/vision-auto

# Local Ollama: no key, last-resort fallback when the spine is unreachable.
ollama:
  genie:
    model: qwen2.5:1.5b
    temperature: 0.4
  coding:
    model: qwen2.5:1.5b
    temperature: 0.2
  design:
    model: qwen2.5:1.5b
    temperature: 0.7
  reporting:
    model: qwen2.5:1.5b
    temperature: 0.3
  qa:
    model: qwen2.5:1.5b
    temperature: 0.2
  research:
    model: qwen2.5:1.5b
    temperature: 0.3
  integration:
    model: qwen2.5:1.5b
    temperature: 0.2
  sidekick:
    model: qwen2.5:1.5b
    temperature: 0.5

# --- Direct cloud backends: reachable only when the spine is unavailable. ---
# Prefer the spine. A token in the vault no longer overrides `default_backend`.

groq:
  enabled_if_token: GROQ_API_KEY
  base_url: https://api.groq.com/openai/v1
  models:
    fast: llama-3.1-8b-instant
    strong: llama-3.3-70b-versatile

gemini:
  # Google AI Studio free tier.
  # Get a key at https://aistudio.google.com/app/apikey
  enabled_if_token: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta
  models:
    fast: gemini-2.5-flash
    strong: gemini-2.5-pro

huggingface:
  enabled_if_token: HF_TOKEN
  base_url: https://api-inference.huggingface.co
  models:
    fast: meta-llama/Llama-3.2-3B-Instruct
    strong: Qwen/Qwen2.5-7B-Instruct
